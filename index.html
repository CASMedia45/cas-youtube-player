<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CAS YouTube Player</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

#player{
    width:1920px;
    height:1080px;
    max-width:100%;
    max-height:100%;
}

#diagnostic{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    color:white;
    background:rgba(0,0,0,0.75);
    padding:8px 12px;
    font-family:Arial,sans-serif;
    font-size:16px;
    line-height:1.4;
    pointer-events:none;
}
</style>

<script src="https://www.youtube.com/iframe_api"></script>

</head>

<body>

<div id="player"></div>

<div id="diagnostic">
    Loading...
</div>

<script>

const params = new URLSearchParams(window.location.search);

const videoId = params.get("videoId");

const autoplay = params.get("autoplay") || "1";
const mute = params.get("mute") || "0";
const controls = params.get("controls") || "0";
const loop = params.get("loop") || "1";
const rel = params.get("rel") || "0";
const cc = params.get("cc") || "0";

let player;


/*
 * CAPTION REMOVAL
 * This is the working code that removes captions.
 */

function killCaptions(target){

    try{
        target.unloadModule("captions");
    }catch(e){}

}


/*
 * DIAGNOSTIC INFORMATION
 */

function updateDiagnostic(){

    if(!player){
        return;
    }

    let quality = "unknown";
    let available = "unknown";
    let playerWidth = "unknown";
    let playerHeight = "unknown";

    try{
        quality = player.getPlaybackQuality();
    }catch(e){}

    try{
        available = player.getAvailableQualityLevels().join(", ");
    }catch(e){}

    try{
        playerWidth = player.getIframe().clientWidth;
        playerHeight = player.getIframe().clientHeight;
    }catch(e){}

    document.getElementById("diagnostic").innerHTML =
        "YouTube Quality: " + quality +
        "<br>Available: " + available +
        "<br>Player Size: " + playerWidth + " x " + playerHeight;

}


/*
 * REQUEST 1080P
 */

function request1080(){

    if(!player){
        return;
    }

    try{
        player.setPlaybackQuality("hd1080");
    }catch(e){}

    updateDiagnostic();

}


/*
 * CREATE YOUTUBE PLAYER
 */

function onYouTubeIframeAPIReady(){

    player = new YT.Player("player",{

        width:"1920",
        height:"1080",

        videoId:videoId,

        playerVars:{
            autoplay:Number(autoplay),
            controls:Number(controls),
            rel:Number(rel),
            loop:Number(loop),
            playlist:videoId,
            playsinline:1,
            modestbranding:1,
            iv_load_policy:3,
            cc_load_policy:Number(cc),
            fs:0
        },

        events:{
            onReady:onPlayerReady,
            onStateChange:onPlayerStateChange
        }

    });

}


/*
 * PLAYER READY
 */

function onPlayerReady(event){

    if(mute==="1"){
        event.target.mute();
    }else{
        event.target.unMute();
    }

    if(cc==="0"){
        killCaptions(event.target);
    }

    event.target.playVideo();

    /*
     * Request 1080 after playback begins.
     */

    setTimeout(request1080,1000);
    setTimeout(request1080,3000);
    setTimeout(request1080,5000);
    setTimeout(request1080,10000);

}


/*
 * PLAYER STATE CHANGES
 */

function onPlayerStateChange(event){

    /*
     * Continue removing captions.
     */

    if(cc==="0" && event.data === 1){

        killCaptions(event.target);

        setTimeout(function(){

            killCaptions(event.target);

        },1500);

    }

    /*
     * Request 1080 after playback actually starts.
     */

    if(event.data === 1){

        setTimeout(request1080,1000);
        setTimeout(request1080,3000);
        setTimeout(request1080,5000);

    }

}

</script>

</body>
</html>
