<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>CAS YouTube Diagnostic</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

#diagnostic {
    position: fixed;
    top: 20px;
    left: 20px;

    z-index: 999999;

    background: black;
    color: white;

    border: 3px solid red;

    padding: 12px 16px;

    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1.4;

    max-width: 850px;

    pointer-events: none;
}

</style>

<script src="https://www.youtube.com/iframe_api"></script>

</head>

<body>

<div id="player"></div>

<div id="diagnostic">
Loading diagnostic...
</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const videoId =
    params.get("videoId");

let player;


/*
 * CAPTIONS OFF
 */

function killCaptions(target) {

    try {

        target.unloadModule("captions");

    } catch(e) {}

}


/*
 * VIDEO CODEC TEST
 */

function codecTest() {

    const video =
        document.createElement("video");

    let h264 = "no";
    let vp9 = "no";
    let av1 = "no";

    try {

        h264 =
            video.canPlayType(
                'video/mp4; codecs="avc1.42E01E"'
            ) || "no";

    } catch(e) {}


    try {

        vp9 =
            video.canPlayType(
                'video/webm; codecs="vp9"'
            ) || "no";

    } catch(e) {}


    try {

        av1 =
            video.canPlayType(
                'video/mp4; codecs="av01.0.05M.08"'
            ) || "no";

    } catch(e) {}


    return {

        h264: h264,
        vp9: vp9,
        av1: av1

    };

}


/*
 * UPDATE DIAGNOSTIC
 */

function updateDiagnostic() {

    if (!player) {
        return;
    }

    let quality = "unknown";
    let available = "unknown";

    let playerWidth = "unknown";
    let playerHeight = "unknown";


    try {

        quality =
            player.getPlaybackQuality();

    } catch(e) {}


    try {

        available =
            player
            .getAvailableQualityLevels()
            .join(", ");

    } catch(e) {}


    try {

        playerWidth =
            player.getIframe().clientWidth;

        playerHeight =
            player.getIframe().clientHeight;

    } catch(e) {}


    const codecs =
        codecTest();


    document.getElementById(
        "diagnostic"
    ).innerHTML =

        "<b>CAS YouTube Diagnostic</b>" +

        "<br><br>" +

        "<b>YouTube Quality:</b> " +
        quality +

        "<br><b>Available:</b> " +
        available +

        "<br><b>Player Size:</b> " +
        playerWidth +
        " x " +
        playerHeight +

        "<br><br>" +

        "<b>Screen:</b> " +
        screen.width +
        " x " +
        screen.height +

        "<br><b>Viewport:</b> " +
        window.innerWidth +
        " x " +
        window.innerHeight +

        "<br><b>Pixel Ratio:</b> " +
        window.devicePixelRatio +

        "<br><br>" +

        "<b>H.264:</b> " +
        codecs.h264 +

        " &nbsp; <b>VP9:</b> " +
        codecs.vp9 +

        " &nbsp; <b>AV1:</b> " +
        codecs.av1 +

        "<br><br>" +

        "<b>User Agent:</b><br>" +
        navigator.userAgent;

}


/*
 * CREATE PLAYER
 */

function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            "player",
            {

                width: "100%",
                height: "100%",

                videoId: videoId,

                playerVars: {

                    autoplay: 1,
                    controls: 0,
                    rel: 0,
                    playsinline: 1,
                    modestbranding: 1,
                    iv_load_policy: 3,
                    cc_load_policy: 0,
                    fs: 0

                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onPlaybackQualityChange:
                        onPlaybackQualityChange

                }

            }
        );

}


/*
 * READY
 */

function onPlayerReady(event) {

    killCaptions(
        event.target
    );

    event.target.playVideo();

    updateDiagnostic();

    setTimeout(
        updateDiagnostic,
        1000
    );

    setTimeout(
        updateDiagnostic,
        3000
    );

    setTimeout(
        updateDiagnostic,
        5000
    );

    setTimeout(
        updateDiagnostic,
        10000
    );

}


/*
 * STATE CHANGE
 */

function onPlayerStateChange(event) {

    if (event.data === 1) {

        killCaptions(
            event.target
        );

    }

    updateDiagnostic();

}


/*
 * QUALITY CHANGE
 */

function onPlaybackQualityChange() {

    updateDiagnostic();

}

</script>

</body>
</html>
