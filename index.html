<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

#testbox {
    position: absolute;
    left: 20px;
    top: 20px;

    width: 500px;
    height: 150px;

    background: red;
    color: white;

    font-family: Arial, sans-serif;
    font-size: 24px;

    padding: 20px;

    z-index: 1000000;
}
</style>

<script src="https://www.youtube.com/iframe_api"></script>

</head>

<body>

<div id="player"></div>

<div id="testbox">
DIAGNOSTIC TEST<br>
If you can see this red box,<br>
HTML overlays are working.
</div>

<script>

const params = new URLSearchParams(window.location.search);

const videoId = params.get("videoId");

let player;

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

        width: "100%",
        height: "100%",

        videoId: videoId,

        playerVars: {
            autoplay: 1,
            controls: 0,
            rel: 0,
            playsinline: 1,
            modestbranding: 1,
            iv_load_policy: 3,
            cc_load_policy: 0,
            fs: 0
        }

    });

}

</script>

</body>
</html>
