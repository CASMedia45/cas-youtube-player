<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CAS YouTube Player</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

#diagnostic {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 999999;
    color: white;
    background: black;
    border: 2px solid white;
    padding: 10px 15px;
    font-family: Arial, sans-serif;
    font-size: 20px;
    line-height: 1.5;
    display: block;
    visibility: visible;
    opacity: 1;
    pointer-events: none;
}
</style>

<script src="https://www.youtube.com/iframe_api"></script>

</head>

<body>

<div id="player"></div>

<div id="diagnostic">
    YouTube diagnostic loading...
</div>

<script>

const params = new URLSearchParams(window.location.search);

const videoId = params.get("videoId");

const autoplay = params.get("autoplay") || "1";
const mute = params.get("mute") || "0";
const controls = params.get("controls") || "0";
const loop = params.get("loop") || "1";
const rel = params.get("rel") || "0";
const cc = params.get("cc") || "0";

let player;


/*
 * REMOVE CAPTIONS
 */

function killCaptions(target) {

    try {
        target.unloadModule("captions");
    } catch(e) {}

}


/*
 * UPDATE DIAGNOSTIC
 */

function updateDiagnostic() {

    const diagnostic = document.getElementById("diagnostic");

    if (!player) {
        diagnostic.innerHTML = "YouTube player not ready";
        return;
    }

    let quality = "unknown";
    let available = "unknown";
    let width = "unknown";
    let height = "unknown";

    try {
        quality = player.getPlaybackQuality();
    } catch(e) {}

    try {
        available = player.getAvailableQualityLevels().join(", ");
    } catch(e) {}

    try {
        width = player.getIframe().clientWidth;
        height = player.getIframe().clientHeight;
    } catch(e) {}

    diagnostic.innerHTML =
        "YouTube Quality: " + quality +
        "<br>Available: " + available +
        "<br>Player Size: " + width + " x " + height;

}


/*
 * REQUEST 1080P
 */

function request1080() {

    if (!player) {
        return;
    }

    try {
        player.setPlaybackQuality("hd1080");
    } catch(e) {}

    updateDiagnostic();

}


/*
 * CREATE YOUTUBE PLAYER
 */

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

        width: "100%",
        height: "100%",

        videoId: videoId,

        playerVars: {

            autoplay: Number(autoplay),
            controls: Number(controls),
            rel: Number(rel),
            loop: Number(loop),
            playlist: videoId,
            playsinline: 1,
            modestbranding: 1,
            iv_load_policy: 3,
            cc_load_policy: Number(cc),
            fs: 0

        },

        events: {

            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange

        }

    });

}


/*
 * PLAYER READY
 */

function onPlayerReady(event) {

    if (mute === "1") {
        event.target.mute();
    } else {
        event.target.unMute();
    }

    if (cc === "0") {
        killCaptions(event.target);
    }

    event.target.playVideo();

    setTimeout(request1080, 1000);
    setTimeout(request1080, 3000);
    setTimeout(request1080, 5000);
    setTimeout(request1080, 10000);

}


/*
 * PLAYER STATE CHANGE
 */

function onPlayerStateChange(event) {

    if (cc === "0" && event.data === 1) {

        killCaptions(event.target);

        setTimeout(function() {
            killCaptions(event.target);
        }, 1500);

    }

    if (event.data === 1) {

        setTimeout(request1080, 1000);
        setTimeout(request1080, 3000);
        setTimeout(request1080, 5000);

    }

}

</script>

</body>
</html>
