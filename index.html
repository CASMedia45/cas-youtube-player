<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CAS YouTube Player</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

#player{
    width:100%;
    height:100%;
}
</style>

<script src="https://www.youtube.com/iframe_api"></script>

</head>

<body>

<div id="player"></div>

<script>

const params = new URLSearchParams(window.location.search);

const videoId = params.get("videoId");

const autoplay = params.get("autoplay") || "1";
const mute = params.get("mute") || "0";
const controls = params.get("controls") || "0";
const loop = params.get("loop") || "1";
const rel = params.get("rel") || "0";
const cc = params.get("cc") || "0"; // 0 = captions off by default, 1 = captions on

let player;

function onYouTubeIframeAPIReady(){

    player = new YT.Player("player",{

        width:"100%",
        height:"100%",

        videoId:videoId,

        playerVars:{
            autoplay:Number(autoplay),
            controls:Number(controls),
            rel:Number(rel),
            loop:Number(loop),
            playlist:videoId,
            playsinline:1,
            modestbranding:1,
            iv_load_policy:3,
            cc_load_policy:Number(cc),
            fs:0
        },

        events:{
            onReady:onPlayerReady,
            onStateChange:onPlayerStateChange
        }

    });

}

function killCaptions(target){
    // undocumented but real: the captions module exposes loadModule/
    // unloadModule, which is the same call YouTube's own CC button makes.
    // cc_load_policy only sets a *default* -- it can't override a viewer's
    // (or a device's browser profile's) stored caption preference. This
    // forcibly tears the module down instead of just deferring to it.
    try{
        target.unloadModule("captions");
    }catch(e){}
}

function onPlayerReady(event){

    if(mute==="1"){
        event.target.mute();
    }else{
        event.target.unMute();
    }

    if(cc==="0"){
        killCaptions(event.target);
    }

    event.target.playVideo();

}

function onPlayerStateChange(event){

    // The captions module often only actually attaches once playback
    // starts, so re-issue the kill right as the video transitions to
    // playing (state 1), and once more shortly after for good measure.
    if(cc==="0" && event.data === 1){
        killCaptions(event.target);
        setTimeout(function(){ killCaptions(event.target); }, 1500);
    }

}

</script>

</body>
</html>
