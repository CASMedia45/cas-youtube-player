<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CAS YouTube Player</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

#player{
    width:100%;
    height:100%;
}

#diagnostic{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    color:white;
    background:rgba(0,0,0,0.75);
    padding:8px 12px;
    font-family:Arial,sans-serif;
    font-size:16px;
    line-height:1.4;
    pointer-events:none;
}
</style>

<script src="https://www.youtube.com/iframe_api"></script>

</head>

<body>

<div id="player"></div>
<div id="diagnostic">Loading...</div>

<script>

const params = new URLSearchParams(window.location.search);

const videoId = params.get("videoId");

const autoplay = params.get("autoplay") || "1";
const mute = params.get("mute") || "0";
const controls = params.get("controls") || "0";
const loop = params.get("loop") || "1";
const rel = params.get("rel") || "0";
const cc = params.get("cc") || "0";

let player;

function updateDiagnostic(){

    if(!player){
        return;
    }

    let quality = "unknown";
    let available = "unknown";
    let videoWidth = "unknown";
    let videoHeight = "unknown";

    try{
        quality = player.getPlaybackQuality();
    }catch(e){}

    try{
        available = player.getAvailableQualityLevels().join(", ");
    }catch(e){}

    try{
        videoWidth = player.getVideoData().video_id;
    }catch(e){}

    try{
        videoWidth = player.getIframe().clientWidth;
        videoHeight = player.getIframe().clientHeight;
    }catch(e){}

    document.getElementById("diagnostic").innerHTML =
        "YouTube Quality: " + quality +
        "<br>Available: " + available +
        "<br>Player Size: " + videoWidth + " x " + videoHeight;
}

function onYouTubeIframeAPIReady(){

    player = new YT.Player("player",{

        width:"100%",
        height:"100%",

        videoId:videoId,

        playerVars:{
            autoplay:Number(autoplay),
            controls:Number(controls),
            rel:Number(rel),
            loop:Number(loop),
            playlist:videoId,
            playsinline:1,
            modestbranding:1,
            iv_load_policy:3,
            cc_load_policy:Number(cc),
            fs:0
        },

        events:{
            onReady:onPlayerReady,
            onStateChange:onPlayerStateChange
        }

    });

}

function killCaptions(target){

    try{
        target.unloadModule("captions");
    }catch(e){}

}

function onPlayerReady(event){

    if(mute==="1"){
        event.target.mute();
    }else{
        event.target.unMute();
    }

    if(cc==="0"){
        killCaptions(event.target);
    }

    /*
     * Request 1080p.
     */
    try{
        event.target.setPlaybackQuality("hd1080");
    }catch(e){}

    event.target.playVideo();

    setTimeout(updateDiagnostic,1000);
    setTimeout(updateDiagnostic,3000);
    setTimeout(updateDiagnostic,6000);

}

function onPlayerStateChange(event){

    if(cc==="0" && event.data === 1){

        killCaptions(event.target);

        setTimeout(function(){
            killCaptions(event.target);
        },1500);

    }

    if(event.data === 1){

        try{
            event.target.setPlaybackQuality("hd1080");
        }catch(e){}

        setTimeout(updateDiagnostic,1000);
        setTimeout(updateDiagnostic,3000);

    }

}

</script>

</body>
</html>
