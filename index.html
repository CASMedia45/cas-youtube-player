<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: calc(100% - 120px);
}

#diagnostic {
    position: absolute;
    left: 0;
    bottom: 0;

    width: 100%;
    height: 120px;

    box-sizing: border-box;

    background: black;
    color: white;

    padding: 10px 20px;

    font-family: Arial, sans-serif;
    font-size: 18px;

    z-index: 1000000;
}

</style>

<script src="https://www.youtube.com/iframe_api"></script>

</head>

<body>

<div id="player"></div>

<div id="diagnostic">
Loading diagnostic...
</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const videoId =
    params.get("videoId");

let player;


function updateDiagnostic() {

    let quality = "unknown";
    let available = "unknown";

    try {
        quality =
            player.getPlaybackQuality();
    } catch(e) {}

    try {
        available =
            player.getAvailableQualityLevels()
                .join(", ");
    } catch(e) {}

    document.getElementById(
        "diagnostic"
    ).innerHTML =

        "<b>YouTube Quality:</b> " +
        quality +

        " &nbsp;&nbsp; " +

        "<b>Available:</b> " +
        available +

        "<br>" +

        "<b>Screen:</b> " +
        screen.width +
        " x " +
        screen.height +

        " &nbsp;&nbsp; " +

        "<b>Viewport:</b> " +
        window.innerWidth +
        " x " +
        window.innerHeight +

        " &nbsp;&nbsp; " +

        "<b>Pixel Ratio:</b> " +
        window.devicePixelRatio;

}


function killCaptions(target) {

    try {
        target.unloadModule("captions");
    } catch(e) {}

}


function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            "player",
            {

                width: "100%",
                height: "100%",

                videoId: videoId,

                playerVars: {

                    autoplay: 1,
                    controls: 0,
                    rel: 0,
                    playsinline: 1,
                    modestbranding: 1,
                    iv_load_policy: 3,
                    cc_load_policy: 0,
                    fs: 0

                },

                events: {

                    onReady: function(event) {

                        killCaptions(
                            event.target
                        );

                        event.target.playVideo();

                        updateDiagnostic();

                        setTimeout(
                            updateDiagnostic,
                            2000
                        );

                        setTimeout(
                            updateDiagnostic,
                            5000
                        );

                        setTimeout(
                            updateDiagnostic,
                            10000
                        );

                    },

                    onStateChange:
                        function(event) {

                            killCaptions(
                                event.target
                            );

                            updateDiagnostic();

                        },

                    onPlaybackQualityChange:
                        function(event) {

                            updateDiagnostic();

                        }

                }

            }
        );

}

</script>

</body>
</html>
