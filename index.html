<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAS YouTube Player</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* Temporary diagnostic display */
        #quality {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 14px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div id="player"></div>

    <!-- Temporary quality diagnostic -->
    <div id="quality">
        YouTube Quality: Waiting...
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // Get parameters from the URL
        const params = new URLSearchParams(window.location.search);

        const videoId = params.get("videoId");
        const autoplay = params.get("autoplay") || "1";
        const mute = params.get("mute") || "0";

        let player;

        // YouTube API calls this automatically when it is ready
        function onYouTubeIframeAPIReady() {

            player = new YT.Player("player", {

                width: "100%",
                height: "100%",

                videoId: videoId,

                playerVars: {
                    autoplay: Number(autoplay),
                    controls: 0,
                    rel: 0,
                    playsinline: 1,
                    modestbranding: 1,
                    iv_load_policy: 3
                },

                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange,
                    onPlaybackQualityChange: onPlaybackQualityChange
                }
            });
        }

        // Player ready
        function onPlayerReady(event) {

            if (mute === "1") {
                event.target.mute();
            } else {
                event.target.unMute();
            }

            event.target.playVideo();
        }

        // Player state changed
        function onPlayerStateChange(event) {

            // Keep video playing if YouTube pauses unexpectedly
            if (event.data === YT.PlayerState.PAUSED) {
                event.target.playVideo();
            }
        }

        // This is the important diagnostic function
        function onPlaybackQualityChange(event) {

            const quality = event.data;

            let displayQuality = quality;

            switch (quality) {

                case "highres":
                    displayQuality = "HIGH RESOLUTION";
                    break;

                case "hd1080":
                    displayQuality = "1080p";
                    break;

                case "hd720":
                    displayQuality = "720p";
                    break;

                case "large":
                    displayQuality = "480p";
                    break;

                case "medium":
                    displayQuality = "360p";
                    break;

                case "small":
                    displayQuality = "240p";
                    break;
            }

            document.getElementById("quality").innerHTML =
                "YouTube Quality: <strong>" +
                displayQuality +
                "</strong><br>" +
                "API: " +
                quality +
                "<br>" +
                "Viewport: " +
                window.innerWidth +
                " x " +
                window.innerHeight;

            console.log("YouTube playback quality:", quality);
        }
    </script>

</body>
</html>
