<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CAS YouTube Player</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<div id="player-container">
    <div id="youtube-player"></div>
</div>

<script>
    /*
     * CAS Cable YouTube Player
     *
     * Example:
     * https://casmedia45.github.io/cas-youtube-player/?videoId=ItLAis8kw3s
     *
     * Optional:
     * &autoplay=1
     * &mute=0
     */

    // ------------------------------------------------------------
    // GET SETTINGS FROM URL
    // ------------------------------------------------------------

    const urlParams = new URLSearchParams(window.location.search);

    const videoId = urlParams.get("videoId");

    const autoplay =
        urlParams.get("autoplay") !== "0" ? 1 : 0;

    const mute =
        urlParams.get("mute") === "0" ? 0 : 1;


    // ------------------------------------------------------------
    // MAKE SURE A VIDEO ID WAS PROVIDED
    // ------------------------------------------------------------

    if (!videoId) {
        document.getElementById("player-container").innerHTML =
            '<div style="color:white;font-family:Arial;text-align:center;padding-top:40px;">No YouTube video ID specified.</div>';
    }


    // ------------------------------------------------------------
    // LOAD YOUTUBE IFRAME API
    // ------------------------------------------------------------

    if (videoId) {

        const tag = document.createElement("script");

        tag.src = "https://www.youtube.com/iframe_api";

        const firstScriptTag =
            document.getElementsByTagName("script")[0];

        firstScriptTag.parentNode.insertBefore(
            tag,
            firstScriptTag
        );
    }


    // ------------------------------------------------------------
    // YOUTUBE PLAYER
    // ------------------------------------------------------------

    let player;


    function onYouTubeIframeAPIReady() {

        player = new YT.Player(
            "youtube-player",
            {

                width: "100%",
                height: "100%",

                videoId: videoId,

                playerVars: {

                    // Start automatically
                    autoplay: autoplay,

                    // Mute if requested
                    mute: mute,

                    // Don't show related videos at the end
                    rel: 0,

                    // YouTube branding
                    modestbranding: 1,

                    // Use the current origin
                    origin: window.location.origin,

                    // Request HD
                    vq: "hd1080",

                    // Do not show annotations
                    iv_load_policy: 3,

                    // Allow inline playback
                    playsinline: 1
                },

                events: {

                    onReady: function(event) {

                        /*
                         * Explicitly request 1080p after
                         * the player becomes available.
                         *
                         * If 1080p is not available,
                         * YouTube will select the highest
                         * quality it can provide.
                         */

                        try {
                            event.target.setPlaybackQuality("hd1080");
                        } catch (e) {
                            console.log(
                                "Unable to set playback quality:",
                                e
                            );
                        }

                        if (autoplay) {

                            if (mute) {
                                event.target.mute();
                            }

                            event.target.playVideo();
                        }
                    },


                    onStateChange: function(event) {

                        /*
                         * When playback begins, request
                         * 1080p again.
                         */

                        if (
                            event.data ===
                            YT.PlayerState.PLAYING
                        ) {

                            try {
                                event.target.setPlaybackQuality(
                                    "hd1080"
                                );
                            } catch (e) {
                                console.log(
                                    "Unable to set playback quality:",
                                    e
                                );
                            }
                        }
                    },


                    onError: function(event) {

                        console.log(
                            "YouTube Player Error:",
                            event.data
                        );
                    }
                }
            }
        );
    }

</script>

</body>
</html>
