# CAS YouTube Player — BrightSign Direct IFrame Version

```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CAS YouTube Player</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #youtube-iframe {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: 0;
        }

        /*
         * Temporary diagnostic box.
         * If you see this, the HTML itself is loading.
         */

        #diagnostics {
            position: absolute;
            top: 10px;
            left: 10px;

            z-index: 9999;

            padding: 12px 16px;

            background: rgba(0, 0, 0, 0.85);

            color: #00ff00;

            font-family: Arial, sans-serif;
            font-size: 18px;
            line-height: 1.4;

            border: 1px solid #00ff00;
        }

    </style>

</head>


<body>


<iframe
    id="youtube-iframe"

    title="YouTube Video"

    allow="
        autoplay;
        encrypted-media;
        picture-in-picture;
        fullscreen
    "

    allowfullscreen

    referrerpolicy="strict-origin-when-cross-origin">
</iframe>


<div id="diagnostics">

    CAS YouTube Diagnostic<br>

    <span id="status">
        Building YouTube URL...
    </span>

</div>


<script>


    // ============================================================
    // READ URL PARAMETERS
    // ============================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const videoId =
        params.get("videoId");


    const autoplay =
        params.get("autoplay") !== "0"
            ? 1
            : 0;


    const mute =
        params.get("mute") === "0"
            ? 0
            : 1;


    // ============================================================
    // CHECK FOR VIDEO ID
    // ============================================================

    if (!videoId) {

        document.getElementById(
            "status"
        ).textContent =
            "ERROR: No videoId supplied.";

    }

    else {

        // ========================================================
        // BUILD DIRECT YOUTUBE EMBED URL
        // ========================================================

        const youtubeURL =
            "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId) +

            "?autoplay=" +
            autoplay +

            "&mute=" +
            mute +

            "&controls=0" +

            "&rel=0" +

            "&modestbranding=1" +

            "&playsinline=1" +

            /*
             * Explicitly request captions OFF.
             */
            "&cc_load_policy=0" +

            /*
             * Do not automatically display
             * annotations.
             */
            "&iv_load_policy=3" +

            /*
             * Cache-busting parameter.
             */
            "&v=20260817";


        // ========================================================
        // PUT URL INTO IFRAME
        // ========================================================

        document.getElementById(
            "youtube-iframe"
        ).src =
            youtubeURL;


        // ========================================================
        // DISPLAY DIAGNOSTIC INFORMATION
        // ========================================================

        document.getElementById(
            "status"
        ).innerHTML =
            "YouTube iframe loaded<br>" +
            "Video ID: " +
            videoId +
            "<br>" +
            "Autoplay: " +
            (autoplay ? "ON" : "OFF") +
            "<br>" +
            "Mute: " +
            (mute ? "ON" : "OFF") +
            "<br>" +
            "Captions: OFF requested";

    }


</script>


</body>
</html>
```
